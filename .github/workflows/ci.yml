name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock.txt
      - name: Compile
        run: python -m compileall -q .
      - name: SQLite regression
        env:
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s tests -v
      - name: WSGI and readiness smoke
        env:
          SECRET_KEY: ci-secret-key-012345678901234567890123
          DATABASE_URL: sqlite+pysqlite:///:memory:
          APP_ENV: test
          COOKIE_SECURE: '0'
        run: python -c "from app import create_app; a=create_app({'TESTING': True, 'DATABASE_URL': 'sqlite+pysqlite:///:memory:', 'SECRET_KEY': 'test'}); assert a.test_client().get('/health').status_code == 200; assert a.test_client().get('/ready').status_code == 200; import wsgi; assert callable(wsgi.application)"

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock.txt
      - name: Compile
        run: python -m compileall -q .
      - name: MySQL disposable-database regression
        env:
          MYSQL_TEST_SERVER_URL: mysql+pymysql://root:root-test-password@127.0.0.1:3306
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s tests -v
