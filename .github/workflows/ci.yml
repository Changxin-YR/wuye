name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: SQLite regression
        env:
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s tests -v

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: MySQL disposable-database regression
        env:
          MYSQL_TEST_SERVER_URL: mysql+pymysql://root:root-test-password@127.0.0.1:3306
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s tests -v
