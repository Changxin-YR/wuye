<div class="pagination"><span class="muted">共 {{ total }} 条 · 第 {{ page }} 页</span>{% if page > 1 %}<a class="secondary" href="{{ url_for(request.endpoint,page=page-1,q=q|default(''),status=selected_status|default('')) }}">上一页</a>{% endif %}{% if page * 20 < total %}<a class="secondary" href="{{ url_for(request.endpoint,page=page+1,q=q|default(''),status=selected_status|default('')) }}">下一页</a>{% endif %}</div>
