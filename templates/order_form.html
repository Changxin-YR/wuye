{% extends 'base.html' %}{% block heading %}新增报修{% endblock %}{% block content %}<section class="panel form-panel"><h3>提交维修需求</h3><p class="muted">室内问题请选择物业已绑定的房屋；公共区域问题请选择“公共设施”并填写具体位置。</p><form method="post" enctype="multipart/form-data" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>报修标题<input name="title" maxlength="100" required placeholder="例如：厨房水龙头漏水"></label><label>工单类型<select name="type">{% for kind in order_types %}<option>{{ kind }}</option>{% endfor %}</select></label><label class="span-2">问题详情<textarea name="content" rows="5" maxlength="2000" required></textarea></label><label>关联房屋<select name="house_id"><option value="">公共区域 / 暂无绑定房屋</option>{% for house in houses %}<option value="{{ house.id }}">{{ house.building_name }} {{ house.unit }} {{ house.room_no }}</option>{% endfor %}</select></label><label>具体位置<input name="location" maxlength="200" required placeholder="如：A栋1单元101厨房 / 南门路灯"></label><label>联系人<input name="contact_name" maxlength="50" value="{{ current_user.real_name }}" required></label><label>联系电话<input name="contact_phone" maxlength="20" value="{{ current_user.phone }}" required></label><label class="span-2">问题照片（可选，单张≤5MB）<input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label><div class="form-actions span-2"><a class="secondary" href="{{ url_for('orders') }}">返回</a><button class="primary">提交报修</button></div></form></section>{% endblock %}
