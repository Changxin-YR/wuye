# Dedicated path entrypoint for the property service.
# The site root remains the main site; only /wuye/ reaches this application.

server {
    listen 80;
    listen [::]:80;
    server_name www.23331.cloud;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/lib/property-acme;
        try_files $uri =404;
    }

    location / {
        return 302 https://23331.cloud$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.23331.cloud;

    ssl_certificate /etc/letsencrypt/live/23331.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/23331.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PROPERTY_TLS:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 8m;

    location = /wuye {
        return 301 /wuye/;
    }

    location = /wuye/healthz {
        access_log off;
        default_type application/json;
        proxy_pass http://127.0.0.1:5003/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /wuye/ {
        proxy_pass http://127.0.0.1:5003/;
        proxy_http_version 1.1;
        proxy_cookie_path / /wuye/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /wuye;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location / {
        return 302 https://23331.cloud$request_uri;
    }
}
